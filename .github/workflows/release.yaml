name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.2.0 (release-please creates the tag; this only builds and publishes it)"
        required: true
        type: string

env:
  IMAGE: ghcr.io/p3l1/imap-mini-mcp

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      # github.ref_name is the pushed tag on a tag push, but the dispatching
      # branch on workflow_dispatch, where only the input names the tag.
      - name: Resolve the tag
        id: resolve
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.resolve.outputs.version }}
            ${{ env.IMAGE }}:latest

      - name: Smoke-test the published image
        run: |
          docker run -d --name mcp -p 3000:3000 \
            -e IMAP_HOST=invalid.example -e IMAP_USER=x -e IMAP_PASS=x \
            ${{ env.IMAGE }}:${{ steps.resolve.outputs.version }}
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/healthz && break
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:3000/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | grep -q imap-mini-mcp
          docker rm -f mcp
