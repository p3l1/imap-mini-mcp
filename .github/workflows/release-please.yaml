name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Lets this job dispatch the release workflow once a tag exists.
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A tag pushed with GITHUB_TOKEN raises no events, so release.yaml's tag
      # trigger never fires. workflow_dispatch is the documented exception.
      - name: Build and publish the release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          echo "release-please created $TAG; dispatching the release workflow"
          gh workflow run release.yaml --ref main -f tag="$TAG"
